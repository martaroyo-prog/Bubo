<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Justicia</title>
<meta name="theme-color" content="#23395B">
<meta name="description" content="Mi Justicia: información y ayuda para niños, niñas y adolescentes. Prototipo DATAthon Justicia 2026.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#23395B; --pri-d:#162741; --pri-l:#E9EEF5; --acc:#8C1C2E; --acc-l:#F7ECEE;
  --bg:#F4F5F7; --card:#FFFFFF; --text:#1F2933; --muted:#566271; --line:#D8DCE2;
  --ok:#2E7D5B; --ok-l:#E8F3EE; --sos:#B42318; --sos-l:#FDEDEB; --warn-l:#FFF6E6; --warn:#7A4A00;
  --r:8px; --fs:17px; --side:264px;
}
body.contrast{--pri:#00213F;--pri-d:#000;--pri-l:#FFF;--bg:#FFF;--text:#000;--muted:#000;--line:#000;--acc:#5A0012}
body.big{--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.55;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* cabecera institucional */
.proto{background:var(--pri-d);color:#C9D3E0;font-size:.78em;padding:4px 16px;text-align:center}
.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:3px solid var(--acc);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .t1{font-weight:700;font-size:1.15em;color:var(--pri);line-height:1.1}
.brand .t2{font-size:.78em;color:var(--muted);line-height:1.1}
.top .sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);height:42px;padding:0 12px;font-weight:600;color:var(--pri)}
.hbtn:hover{background:var(--pri-l)}
.hbtn.sos{background:var(--sos);border-color:var(--sos);color:#fff}
.hbtn.sos:hover{background:#8F1C13}
.hbtn.exit{border-color:var(--sos);color:var(--sos)}
.menubtn{display:none}
/* layout */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 90px)}
.side{position:sticky;top:67px;width:var(--side);flex:0 0 var(--side);height:calc(100vh - 67px);overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:14px 10px 30px}
.side h4{margin:14px 10px 6px;font-size:.75em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;border-radius:0 var(--r) var(--r) 0;padding:9px 10px;font-weight:600;color:var(--text)}
.nav:hover{background:var(--pri-l)}
.nav.on{background:var(--pri-l);border-left-color:var(--acc);color:var(--pri)}
.sub{margin:0 0 4px 22px;border-left:1px solid var(--line)}
.sub .nav{font-weight:400;font-size:.92em;padding:6px 10px}
.sub .nav .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.7em;flex:0 0 auto}
.sub .nav .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
main{flex:1;min-width:0;max-width:880px;margin:0 auto;padding:22px 22px 80px}
.edge{display:none}
.scrim{display:none}
@media(max-width:900px){
  .menubtn{display:inline-flex}
  .side{position:fixed;top:0;left:0;height:100vh;z-index:60;transform:translateX(-102%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.15);padding-top:20px}
  body.navopen .side{transform:none}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:55}
  .edge{display:flex;position:fixed;left:0;top:45%;z-index:35;writing-mode:vertical-rl;transform:rotate(180deg);background:var(--pri);color:#fff;border:0;border-radius:var(--r) 0 0 var(--r);padding:10px 3px;font-weight:700;font-size:.68em;letter-spacing:.08em;gap:4px;align-items:center;opacity:.92}
  .edge .ico{width:14px;height:14px}
  main{padding:16px 14px 80px 30px}
  .brand .t1{font-size:1em;white-space:nowrap}
  .hs{width:30px;height:30px;border-width:2px;font-size:.85em}
  .brand .t2{display:none}
  .hbtn .lbl{display:none}
}
footer{font-size:.8em;color:var(--muted);text-align:center;padding:18px 16px 30px;border-top:1px solid var(--line);background:var(--card)}
/* componentes */
h1{font-size:1.65em;line-height:1.2;margin:.1em 0 .4em;color:var(--pri)}
h2{font-size:1.25em;margin:1em 0 .4em;color:var(--pri)}
h3{font-size:1.05em;margin:.3em 0}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)} .note{font-size:.86em;color:var(--muted)}
.crumb{font-size:.85em;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.grid,.grid3{grid-template-columns:1fr}}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:var(--r);padding:16px;transition:transform .15s, box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(35,57,91,.12)}
.tile .ic{width:44px;height:44px;border-radius:var(--r);background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile .ic .ico{width:24px;height:24px}
.tile b{display:block;color:var(--pri);font-size:1.05em}
.tile span.d{color:var(--muted);font-size:.9em}
.hero{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:var(--r);padding:18px}
.sosbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sos-l);border:1px solid #F1B8B2;border-radius:var(--r);padding:12px 16px;margin:14px 0;color:#7A1A12}
.sosbar .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pri);border-radius:var(--r);padding:10px 18px;font-weight:700;background:var(--pri);color:#fff;min-height:46px;text-decoration:none}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--pri)}
.btn.sec:hover{background:var(--pri-l)}
.btn.sos{background:var(--sos);border-color:var(--sos)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--pri-l);color:var(--pri);border-radius:999px;padding:2px 10px;font-size:.78em;font-weight:700}
.progress{height:8px;background:var(--pri-l);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .4s}
/* edad */
.age{max-width:620px;margin:6vh auto 0;text-align:center}
.age .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
@media(max-width:520px){.age .opts{grid-template-columns:1fr}}
.age .opt14{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:22px 14px;font-weight:700;font-size:1.15em;color:var(--pri);transition:border-color .15s, transform .15s}
.age .opt14:hover{border-color:var(--pri);transform:translateY(-2px)}
.age .opt14 small{display:block;font-weight:400;color:var(--muted);font-size:.75em;margin-top:6px}
/* chat */
.privacy{display:flex;gap:10px;background:var(--warn-l);color:var(--warn);border:1px solid #F0D9A8;border-radius:var(--r);padding:10px 12px;font-size:.92em}
.msgs{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.mrow{display:flex;gap:10px;align-items:flex-end}
.msg{max-width:84%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:3px}
.msg.info{border-left:4px solid var(--ok)}
.msg.crisis{background:var(--sos-l);border-color:#F1B8B2}
.msg .src{display:block;margin-top:8px;font-size:.8em;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.speak{background:none;border:0;padding:4px 0 0;font-size:.82em;font-weight:700;color:var(--pri);display:inline-flex;gap:4px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px}
.chip{border:1px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:8px 14px;font-weight:600;min-height:42px}
.chip:hover{background:var(--pri-l)}
.chip.strong{background:var(--pri);color:#fff}
.chip.red{border-color:var(--sos);color:var(--sos)}
.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 12px;display:flex;gap:8px}
.composer input{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--card);min-height:48px}
.composer input:focus{outline:2px solid var(--pri);outline-offset:0}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.phone{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.phone .num{font-weight:700;font-size:1.15em;color:var(--pri);min-width:90px}
.phone .btn{margin-left:auto;min-height:40px;padding:8px 14px}
.call{text-align:center;padding:28px 12px}
.call .timer{font-size:2em;font-weight:700;color:var(--pri)}
.pulse{animation:pu 1.6s infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* juego */
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:box-shadow .15s}
.lvl:hover{box-shadow:0 4px 14px rgba(35,57,91,.12)}
.lvl .n{flex:0 0 44px;height:44px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-weight:700;font-size:1.15em;display:flex;align-items:center;justify-content:center}
.lvl.done .n{background:var(--ok);color:#fff}
.flip{perspective:900px;height:160px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line)}
.flip .f{background:var(--pri-l);color:var(--pri)} .flip .f .e{font-size:36px}
.flip .b{background:var(--card);transform:rotateY(180deg);font-size:.95em}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 14px;margin:8px 0;min-height:46px}
.opt:hover{border-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-l)} .opt.wrong{border-color:var(--sos);background:var(--sos-l)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:10px 0 14px;gap:4px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--acc)}
.photo{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000}
.photo img{display:block;width:100%;height:auto}
.hs{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:var(--acc);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:0}
.hs::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ring 2s infinite}
.hs.on{background:var(--pri);transform:translate(-50%,-50%) scale(1.15)}
@keyframes ring{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.5)}}
.credit{font-size:.75em;color:var(--muted);margin:6px 0 0}
.hlist{counter-reset:h;list-style:none;padding:0;margin:10px 0}
.hlist li button{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:6px 0}
.hlist li button.on{border-color:var(--pri);background:var(--pri-l)}
.hlist .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85em}
.step{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 14px;margin:8px 0}
.step.placed{background:var(--ok-l);border-color:var(--ok)}
.step.no{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.emo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emo button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 4px;font-weight:600}
.emo button .e{font-size:34px;display:block}
.emo button.sel{border-color:var(--pri);background:var(--pri-l)}
.breath{display:flex;flex-direction:column;align-items:center;gap:10px}
.ball{width:110px;height:110px;border-radius:50%;background:var(--pri-l);border:3px solid var(--pri);transition:transform 4s ease-in-out}
.ball.grow{transform:scale(1.4)}
.lvnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
/* diccionario */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.word{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.word .e{font-size:30px}
.word b{display:block;color:var(--pri);margin:4px 0}
.word p{font-size:.9em;margin:0}
.search{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--card);min-height:48px;margin-bottom:14px}
details{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:var(--r);padding:12px 16px;margin:12px 0}
details summary{font-weight:700;color:var(--pri);cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;font-size:1.2em}
details[open] summary::after{content:"−"}
/* aula */
body.aula{--fs:22px}
.slide{min-height:58vh}
.slidenav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)}
/* ajustes */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:#C3CAD3;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
select{padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
/* modal 112 */
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,25,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--card);border-radius:var(--r);max-width:440px;width:100%;padding:22px;border-top:6px solid var(--sos);max-height:92vh;overflow:auto}
.big112{font-size:3.4em;font-weight:700;color:var(--sos);line-height:1;text-align:center;margin:8px 0}
/* camuflaje */
#camo{position:fixed;inset:0;z-index:100;background:linear-gradient(#7EC3F0,#D6EEFB);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#123;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#camo[hidden]{display:none}
#camo .temp{font-size:72px;font-weight:300}
#camo .city{font-size:22px}
#camo .days{display:flex;gap:18px;margin-top:30px;font-size:15px;text-align:center}
/* ===== 14+: iconos de línea en negro en lugar de emojis ===== */
.gly{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:#1F2933;vertical-align:middle;flex:0 0 auto}
.gly .ico{width:23px;height:23px;stroke-width:1.6}
.flip .f .gly{width:56px;height:56px;margin-bottom:8px;border-color:#C5CDD8}.flip .f .gly .ico{width:28px;height:28px}
.emo button .gly{display:flex;margin:0 auto 6px;width:auto;height:auto;border:0;background:none}.emo button .gly .ico{width:42px;height:42px;stroke-width:1.4}

.lvh .gly{width:44px;height:44px;margin-right:6px;position:relative;top:-4px}.lvh .gly .ico{width:24px;height:24px}
.lvic .e,.kic .e{font-size:26px}.aic .e{font-size:30px}
.kic .gly{margin-bottom:6px}
body.contrast .gly{color:#000;border-color:#000}
/* ===== menores de 14: estilo infantil ===== */
body.kid{--pri:#2C6BD8;--pri-d:#1C4BA0;--pri-l:#E4EEFF;--acc:#FF8A3D;--acc-l:#FFF0E4;--bg:#FFF7E8;--card:#FFFFFF;--text:#28304A;--muted:#5C6482;--line:#F0DFC0;--ok:#22A866;--ok-l:#E2F6EB;--r:20px;
 font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;background-color:var(--bg);background-image:radial-gradient(#FFDFA3 1.4px,transparent 1.7px);background-size:26px 26px}
body.kid h1,body.kid h2,body.kid h3,body.kid .brand .t1,body.kid .tile b,body.kid .lvl b,body.kid .word b,body.kid .flip b{font-family:"Baloo 2","Nunito",sans-serif}
body.kid h1{font-size:1.95em;font-weight:800;color:var(--pri-d)}
body.kid h2{font-weight:800}
body.kid .proto{background:var(--pri-d)}
body.kid .top{border-bottom:0;background:linear-gradient(90deg,#FF6B6B,#FFB84D,#FFD93D,#4CC38A,#4D9DFF,#A77BFF) bottom/100% 6px no-repeat,var(--card)}
body.kid .brand .t1{font-size:1.35em;font-weight:800}
body.kid .hbtn{border-radius:999px;border-width:2px}
body.kid .btn{border-radius:999px;border:0;font-weight:800;box-shadow:0 4px 0 var(--pri-d);transition:transform .1s,box-shadow .1s}
body.kid .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
body.kid .btn.sec{background:#fff;color:var(--pri);border:2px solid #C8D8F6;box-shadow:0 4px 0 #C8D8F6}
body.kid .btn.sos{box-shadow:0 4px 0 #7E160E}
body.kid .btn.ok{box-shadow:0 4px 0 #157A49}
body.kid .btn[disabled]{box-shadow:none}
body.kid .card,body.kid details,body.kid .phone,body.kid .opt,body.kid .step{border-width:2px;box-shadow:0 4px 0 rgba(140,100,40,.07)}
body.kid details{border-left-width:2px}
body.kid .pill{background:#FFD166;color:#5A3A00}
body.kid .hero{border:0;border-radius:28px;background:linear-gradient(135deg,#BFE4FF,#E6F6FF);box-shadow:0 6px 0 #A3D2F5}
body.kid .hero svg{animation:float 3s ease-in-out infinite;flex:0 0 auto}
@keyframes float{50%{transform:translateY(-7px) rotate(-3deg)}}
body.kid .sosbar{border-radius:22px;border-width:2px}
body.kid .grid .tile{--tb:#FFE4E7;--tc:#D63B47}
body.kid .grid .tile:nth-child(6n+2){--tb:#FFF0C4;--tc:#B87400}

/* ======================= BUBO (búho guía) ======================= */
function bubo(expr='happy', w=64){
  const eyesOpen = `<circle cx="37" cy="42" r="7" fill="#1E2A3A"/><circle cx="63" cy="42" r="7" fill="#1E2A3A"/><circle cx="39.5" cy="39.5" r="2.4" fill="#fff"/><circle cx="65.5" cy="39.5" r="2.4" fill="#fff"/>`;
  const eyesClosed = `<path d="M30 43q7-7 14 0M56 43q7-7 14 0" fill="none" stroke="#1E2A3A" stroke-width="3.2" stroke-linecap="round"/>`;
  let eyes = expr==='happy'||expr==='party' ? eyesClosed : eyesOpen;
  let beak = expr==='talk' ? `<path d="M45 51h10l-5 9z" fill="#E08A2E"/><path d="M47 55h6" stroke="#9A5512" stroke-width="1.5"/>` : `<path d="M45 51h10l-5 8z" fill="#E08A2E"/>`;
  let extra = (expr==='listen'||expr==='party') ? `<ellipse cx="26" cy="54" rx="5" ry="3" fill="#F2B8B0"/><ellipse cx="74" cy="54" rx="5" ry="3" fill="#F2B8B0"/>` : '';
  if(expr==='party') extra += `<circle cx="10" cy="14" r="3" fill="#8C1C2E"/><circle cx="90" cy="12" r="3" fill="#E08A2E"/><circle cx="86" cy="28" r="2.5" fill="#2E7D5B"/>`;
  return `<svg width="${w}" height="${w}" viewBox="0 0 100 100" aria-hidden="true">
   <path d="M22 26L28 8l12 14M78 26L72 8 60 22" fill="#8A6A4F"/>
   <ellipse cx="50" cy="57" rx="35" ry="38" fill="#A9825F"/>
   <ellipse cx="18" cy="64" rx="8" ry="20" fill="#8A6A4F" transform="rotate(12 18 64)"/><ellipse cx="82" cy="64" rx="8" ry="20" fill="#8A6A4F" transform="rotate(-12 82 64)"/>
   <ellipse cx="50" cy="74" rx="22" ry="19" fill="#F3E6D3"/>
   <path d="M42 70q3 3 6 0M52 70q3 3 6 0M47 78q3 3 6 0" fill="none" stroke="#D8C2A4" stroke-width="1.6" stroke-linecap="round"/>
   <circle cx="37" cy="42" r="14" fill="#F3E6D3"/><circle cx="63" cy="42" r="14" fill="#F3E6D3"/>
   ${extra}${eyes}${beak}
   <path d="M40 94l-3 4M44 95v4M56 95v4M60 94l3 4" stroke="#E08A2E" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}

{id:'oido', topic:'rights', src:'Convención sobre los Derechos del Niño (art. 12) · Ley Orgánica 1/1996 (art. 9)',

       en:'You have the right to be listened to. When something that affects you is being decided, your opinion counts and adults must take it into account.'},
 teen:{es:'La Convención sobre los Derechos del Niño y la Ley Orgánica 1/1996 reconocen tu derecho a ser oído y escuchado en cualquier procedimiento que te afecte. Tu opinión debe tenerse en cuenta según tu madurez, y la ley considera que a partir de los 12 años tienes madurez suficiente.',
       gl:'A Convención sobre os Dereitos do Neno e a Lei Orgánica 1/1996 recoñecen o teu dereito a ser oído e escoitado en calquera procedemento que che afecte. A túa opinión debe terse en conta segundo a túa madurez, e a lei considera que a partir dos 12 anos tes madurez suficiente.',

{id:'informacion', topic:'rights', src:'Ley Orgánica 1/1996 (art. 5) · Ley 4/2015, Estatuto de la Víctima (arts. 4 y 5)',
 kw:'entender explicar informacion palabras no entiendo entender explicar understand explain information',

       gl:'Tes dereito a que che expliquen o que pasa con palabras que entendas. Se algo non o entendes, podes preguntar todas as veces que precises.',
       en:'You have the right to have what is happening explained in words you understand. If you don\'t understand something, you can ask as many times as you need.'},

{id:'comunicar', topic:'other', src:'Ley Orgánica 8/2021, LOPIVI (art. 17)',
 kw:'contar pedir ayuda solo sola sin adultos avisar denunciar yo mismo axuda tell ask help alone without adults report myself',
 text:{es:'Tú mismo o tú misma puedes contar que te están haciendo daño, sin necesitar a un adulto. Las administraciones deben tener formas seguras y fáciles para que niños y niñas pidan ayuda.',
       gl:'Ti mesmo ou ti mesma podes contar que che están facendo dano, sen precisar dun adulto. As administracións deben ter formas seguras e fáciles para que nenos e nenas pidan axuda.',
       en:'You can tell someone yourself that you are being hurt, without needing an adult. Public services must have safe and easy ways for children to ask for help.'},
 teen:{es:'La LOPIVI reconoce que puedes comunicar por ti mismo una situación de violencia, sin necesidad de que lo haga un adulto. Las administraciones deben habilitar canales seguros, eficaces, adaptados y accesibles, también por medios electrónicos.',
       gl:'A LOPIVI recoñece que podes comunicar por ti mesmo unha situación de violencia, sen necesidade de que o faga un adulto. As administracións deben habilitar canles seguras, eficaces, adaptadas e accesibles, tamén por medios electrónicos.',
       en:'The LOPIVI law recognises that you can report a situation of violence yourself, without needing an adult. Public authorities must provide safe, effective, adapted and accessible channels, including electronic ones.'}},
{id:'deber', topic:'other', src:'Ley Orgánica 8/2021, LOPIVI (arts. 15 y 16)',
 kw:'profesor profe medico adulto obligado avisar saber guardar secreto teacher doctor adult must report secret',
 text:{es:'Cualquier adulto que sepa que un niño o niña está sufriendo violencia tiene que avisar a quien pueda protegerle. Los profesores y los médicos tienen una obligación especial.',
       gl:'Calquera adulto que saiba que un neno ou nena está sufrindo violencia ten que avisar a quen poida protexelo. Os profesores e os médicos teñen unha obriga especial.',
       en:'Any adult who knows a child is suffering violence must tell someone who can protect them. Teachers and doctors have a special duty.'},
 teen:{es:'Toda persona que tenga conocimiento de una situación de violencia contra una persona menor de edad tiene el deber de comunicarlo a la autoridad. Para profesionales como docentes, personal sanitario o de servicios sociales este deber es cualificado.',
       gl:'Toda persoa que teña coñecemento dunha situación de violencia contra unha persoa menor de idade ten o deber de comunicalo á autoridade. Para profesionais como docentes, persoal sanitario ou de servizos sociais este deber é cualificado.',
       en:'Anyone who becomes aware of violence against a minor has a duty to report it to the authorities. For professionals such as teachers, health workers or social services staff this duty is stronger.'}},
{id:'coordinador', topic:'bullying', src:'Ley Orgánica 8/2021, LOPIVI (art. 35)',

       en:'Your school has a wellbeing and protection coordinator. Their job is to make sure you are OK and to help you if someone hurts you. You can go and talk to them.'},
 teen:{es:'Todos los centros educativos deben tener una persona coordinadora de bienestar y protección. Promueve planes contra la violencia, es la persona de referencia para el alumnado y comunica los casos a las autoridades cuando es necesario.',
       gl:'Todos os centros educativos deben ter unha persoa coordinadora de benestar e protección. Promove plans contra a violencia, é a persoa de referencia para o alumnado e comunica os casos ás autoridades cando é necesario.',

{id:'acoso', topic:'bullying', src:'Ley Orgánica 8/2021, LOPIVI (arts. 34 y 35)',
 kw:'acoso escolar bullying insultan pegan molestan clase companeros excluyen burlas compañeiros bullying school insult hit classmates mock exclude',
 text:{es:'Si en el colegio te insultan, te pegan, te dejan de lado o se burlan de ti muchas veces, eso es acoso y no es culpa tuya. Los colegios tienen que actuar. Cuéntaselo a un adulto de confianza.',
       gl:'Se no colexio te insultan, che pegan, te deixan de lado ou se burlan de ti moitas veces, iso é acoso e non é culpa túa. Os colexios teñen que actuar. Cóntallo a un adulto de confianza.',
       en:'If at school people insult you, hit you, leave you out or make fun of you many times, that is bullying and it is not your fault. Schools must act. Tell a trusted adult.'},
 teen:{es:'El acoso escolar son agresiones repetidas (físicas, verbales, de exclusión o por internet) en una situación de desequilibrio de poder. Los centros deben aplicar protocolos de actuación frente al acoso. Puedes comunicarlo a la persona coordinadora de bienestar, a la dirección o a un adulto de confianza.',
       gl:'O acoso escolar son agresións repetidas (físicas, verbais, de exclusión ou por internet) nunha situación de desequilibrio de poder. Os centros deben aplicar protocolos de actuación fronte ao acoso. Podes comunicalo á persoa coordinadora de benestar, á dirección ou a un adulto de confianza.',
       en:'School bullying means repeated aggression (physical, verbal, exclusion or online) where there is an imbalance of power. Schools must apply anti-bullying protocols. You can report it to the wellbeing coordinator, the head of school or a trusted adult.'}},
{id:'ciber', topic:'cyber', src:'Ley Orgánica 8/2021, LOPIVI · Código Penal',
 kw:'ciberacoso internet redes movil whatsapp instagram tiktok mensajes amenazas grupo online mobil mensaxes cyberbullying social media phone messages threats',
 text:{es:'Si te molestan por internet o por el móvil, no estás solo ni sola. No contestes, bloquea a esa persona y enséñaselo a un adulto de confianza.',
       gl:'Se te molestan por internet ou polo móbil, non estás só nin soa. Non contestes, bloquea a esa persoa e amósallo a un adulto de confianza.',
       en:'If someone bothers you online or on your phone, you are not alone. Don\'t reply, block that person and show it to a trusted adult.'},
 teen:{es:'Si sufres ciberacoso, conserva pruebas (capturas con fecha y hora, enlaces y nombre de los perfiles), bloquea y denuncia en la plataforma y pide ayuda. Las amenazas, el acoso reiterado o la suplantación de identidad pueden ser delito y denunciarse ante la policía.',
       gl:'Se sofres ciberacoso, conserva probas (capturas con data e hora, ligazóns e nome dos perfís), bloquea e denuncia na plataforma e pide axuda. As ameazas, o acoso reiterado ou a suplantación de identidade poden ser delito e denunciarse ante a policía.',
       en:'If you are cyberbullied, keep evidence (screenshots with date and time, links and profile names), block and report on the platform and ask for help. Threats, repeated harassment or identity theft can be crimes and can be reported to the police.'}},
{id:'imagenes', topic:'images', src:'Código Penal (art. 197.7) · Agencia Española de Protección de Datos (Canal Prioritario)',
 kw:'fotos foto video intimas desnudo difundido compartido reenviado sexting imagen imaxe espido photos intimate nude shared forwarded image',
 text:{es:'Si alguien ha enseñado o enviado fotos o vídeos tuyos que no querías, no es culpa tuya y no está permitido. No reenvíes esas imágenes y cuéntaselo enseguida a un adulto de confianza: se puede pedir que se borren.',
       gl:'Se alguén amosou ou enviou fotos ou vídeos teus que non querías, non é culpa túa e non está permitido. Non reenvíes esas imaxes e cóntallo axiña a un adulto de confianza: pódese pedir que se borren.',
       en:'If someone has shown or sent photos or videos of you that you didn\'t want shared, it is not your fault and it is not allowed. Don\'t forward them and tell a trusted adult straight away: they can be asked to be deleted.'},
 teen:{es:'Difundir imágenes o vídeos íntimos de una persona sin su autorización es delito, aunque se hubieran conseguido con su consentimiento, y también lo es reenviarlos. Puedes solicitar su retirada urgente a través del Canal Prioritario de la AEPD. No guardes ni reenvíes la imagen: conserva el enlace, el perfil y la fecha.',
       gl:'Difundir imaxes ou vídeos íntimos dunha persoa sen a súa autorización é delito, aínda que se conseguisen co seu consentimento, e tamén o é reenvialos. Podes solicitar a súa retirada urxente a través da Canle Prioritaria da AEPD. Non gardes nin reenvíes a imaxe: conserva a ligazón, o perfil e a data.',
       en:'Sharing someone\'s intimate images or videos without their permission is a crime, even if they were obtained with consent, and so is forwarding them. You can request urgent removal through the AEPD Priority Channel. Don\'t keep or forward the image: save the link, the profile and the date.'}},
{id:'casa', topic:'home', src:'Ley Orgánica 1/1996 (arts. 17 y 18) · Ley Orgánica 8/2021, LOPIVI',
 kw:'casa padres madre padre familia gritos pegan cuidan comida abandonado miedo volver nai pai familia berros home parents mother father family shouting care neglected',
 text:{es:'Tienes derecho a estar protegido o protegida también en casa. Si en tu casa te hacen daño o no te cuidan, hay personas cuyo trabajo es ayudarte. Contarlo no es traicionar a nadie: es pedir que te cuiden.',
       gl:'Tes dereito a estar protexido ou protexida tamén na casa. Se na túa casa che fan dano ou non te coidan, hai persoas cuxo traballo é axudarte. Contalo non é traizoar a ninguén: é pedir que te coiden.',
       en:'You have the right to be protected at home too. If someone at home hurts you or doesn\'t look after you, there are people whose job is to help you. Telling someone is not betraying anyone: it is asking to be looked after.'},
 teen:{es:'Si en tu entorno familiar no se cubren tus necesidades o sufres violencia, las administraciones deben intervenir con medidas de protección, que van desde apoyos a la familia hasta la tutela por la entidad pública en situaciones de desamparo. Tu interés superior es lo primero.',
       gl:'Se no teu contorno familiar non se cobren as túas necesidades ou sofres violencia, as administracións deben intervir con medidas de protección, que van desde apoios á familia ata a tutela pola entidade pública en situacións de desamparo. O teu interese superior é o primeiro.',
       en:'If your needs are not met at home or you suffer violence, the authorities must step in with protection measures, from family support to guardianship by the public child protection agency in cases of abandonment. Your best interests come first.'}},
{id:'dano', topic:'harm', src:'Ley Orgánica 8/2021, LOPIVI · Ley 4/2015, Estatuto de la Víctima',
 kw:'dano tocado cuerpo abuso agresion pegado herido violencia sexual obligado corpo ferido hurt touched body abuse assault injured violence forced',
 text:{es:'Si alguien te ha hecho daño o ha tocado tu cuerpo sin que tú quieras, no es culpa tuya, aunque esa persona te diga lo contrario. Tienes derecho a que te protejan. Si estás en peligro, llama al 112.',
       gl:'Se alguén che fixo dano ou tocou o teu corpo sen que ti quixeras, non é culpa túa, aínda que esa persoa che diga o contrario. Tes dereito a que te protexan. Se estás en perigo, chama ao 112.',
       en:'If someone has hurt you or touched your body when you didn\'t want them to, it is not your fault, even if that person says otherwise. You have the right to be protected. If you are in danger, call 112.'},
 teen:{es:'Si has sufrido una agresión o un abuso, tienes derecho a protección, a atención sanitaria y psicológica y a la ayuda gratuita de las Oficinas de Asistencia a las Víctimas. No es culpa tuya. Si estás en peligro, llama al 112.',
       gl:'Se sufriches unha agresión ou un abuso, tes dereito a protección, a atención sanitaria e psicolóxica e á axuda gratuíta das Oficinas de Asistencia ás Vítimas. Non é culpa túa. Se estás en perigo, chama ao 112.',
       en:'If you have suffered an assault or abuse, you have the right to protection, medical and psychological care and free help from the Victim Support Offices. It is not your fault. If you are in danger, call 112.'}},
{id:'denuncia', topic:'other', src:'Ley de Enjuiciamiento Criminal (arts. 259 y ss.) · Ley Orgánica 8/2021, LOPIVI',
 kw:'denuncia denunciar policia comisaria que es delito juzgado xulgado report complaint police station crime court',

/* ======================= PRIVACIDAD ======================= */
function redact(s){
  let out=s, hit=false;
  const rules=[/\b[\w.+-]+@[\w-]+\.[\w.]+\b/g, /(\+?34[\s-]?)?\b[6789]\d{2}[\s-]?\d{2,3}[\s-]?\d{2,3}[\s-]?\d{0,2}\b/g, /\b\d{8}[A-Za-z]\b/g, /\b[XYZxyz]\d{7}[A-Za-z]\b/g,
   /\b(calle|c\/|avenida|avda\.?|plaza|paseo|r[uú]a|praza|street|road|avenue)\s+[^\s,.;]+(\s+[^\s,.;]+)?(\s*,?\s*(n[ºo°.]?\s*)?\d+)?/gi,
   /\b(colegio|cole|instituto|ies|ceip|colexio|school)\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)*)/g];
  rules.forEach(r=>{ out=out.replace(r,()=>{hit=true;return '[···]';}); });
  out = out.replace(/\b(me llamo|mi nombre es|ch[aá]mome|o meu nome [eé]|my name is|i am called|i'm called)\s+([^\s,.!?]+)/gi,(m,a)=>{hit=true;return a+' [···]';});
  return {text:out, hit};
}

const STOP=new Set('que los las del por para con una uno unos unas como mas pero sus les esta este eso esa hay muy sin sobre the and for you are with this that have what dos das nos unha non mais polo pola cando ten tes tengo teño bien mal siento siente estoy estou ben'.split(' '));
const tok = s => norm(s).replace(/[^a-z0-9ñ ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(w=>w.slice(0,5));
let INDEX=null;
function buildIndex(){
  const docs = CORPUS.map(d=>tok(d.text[LANG]+' '+d.teen[LANG]+' '+d.kw+' '+d.kw));
  const df={}; docs.forEach(ts=>new Set(ts).forEach(w=>df[w]=(df[w]||0)+1));
  INDEX={docs, df, avg:docs.reduce((a,d)=>a+d.length,0)/docs.length, N:docs.length, lang:LANG};
}
function search(q){
  if(!INDEX||INDEX.lang!==LANG) buildIndex();
  const qs=tok(q), k1=1.4, b=.75, {docs,df,avg,N}=INDEX;
  return docs.map((d,i)=>{ let s=0; const tf={}; d.forEach(w=>tf[w]=(tf[w]||0)+1);
    qs.forEach(w=>{ if(!tf[w]) return; const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5)); s+=idf*(tf[w]*(k1+1))/(tf[w]+k1*(1-b+b*d.length/avg)); });
    return {doc:CORPUS[i], s}; }).sort((a,b)=>b.s-a.s);
}

 ['yes',/^(si|sii+|sip|vale|ok|okay|okey|claro|de acuerdo|venga|dale|bueno|yes|yeah|yep|sure)\b/],
 ['no',/^(no|nop|nope|nah|non|para nada|todavia no|aun no|ainda non|not yet)\b/]
];
/* Preguntas de Bubo que se contestan con sí o no: se acepta la respuesta aunque venga con más palabras. */
const YN_ASKS = new Set(['danger','told','adult','helped','person']);
const YN_LEAD = [['dunno',/^(no se(?! (lo|la|los|las|le|les)\b)|non sei|ni idea|no lo se|non o sei|i don ?t know|not sure)\b/],['no',/^(no|non|nop|nope|nah|aun no|todavia no|ainda non|ahora no|agora non|mejor no|de momento no|por ahora no|not yet|not now|para nada|nunca|a nadie|nadie|ninguen)\b/],['yes',/^(si|sii+|sip|vale|ok|okay|claro|venga|dale|de acuerdo|por supuesto|yes|yeah|yep|sure)\b/]];
const ONLINE = /(internet|redes|instagram|\binsta\b|tiktok|whatsapp|wasap|movil|mobil|online|youtube|discord|snapchat|twitch|roblox|fortnite|telegram|chat de clase)/;
const isQuestion =(raw,n) => /[?¿]/.test(raw) || /^(que|como|cuando|donde|quien|cual|por que|puedo|tengo que|hay que|what|how|can|when|where|who|why)\b/.test(n);
const SHORT = new Set(['good','yes','no','dunno','bye']);
const pick = a => a[Math.floor(Math.random()*a.length)];
const DT = d => ((TEEN()&&d.teen ? d.teen : d.text)[LANG]) || d.text.es;
const P = k => L(pick(CH[k]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const plain = s => norm(s).replace(/[^a-z0-9ñ ]/g,' ').replace(/\s+/g,' ').trim();
function intentOf(n){
  for(const [k,re] of INTENT){ if(re.test(n) && (!SHORT.has(k) || n.replace(re,'').trim().split(' ').filter(Boolean).length<=2)) return k; }
  return null;
}
/* El chat NO guarda lo que se escribe: solo los mensajes en pantalla mientras está abierto,
   y el tema elegido (para saber con qué especialista conectar). Sin LLM, nada se envía a ningún sitio. */
function newChat(){ S.chat={msgs:[],chips:[],ask:'danger',topic:null,shown:new Set(),miss:0,view:'chat',busy:false}; addBot(L(CH.greet)); addBot(L(CH.qDanger),{expr:'listen'}); setChips('danger'); }
function addBot(text,o={}){ S.chat.msgs.push({who:'bot',text,...o}); if(S.autoSpeak) speak(text); }
function addMe(text){ S.chat.msgs.push({who:'me',text}); }
function setChips(kind){
  const c=S.chat;
  if(kind==='danger') c.chips=[{l:t('yes'),a:'y',cls:'red'},{l:t('no'),a:'n'},{l:L(CH.dunnoChip),a:'d'}];
  else if(kind==='topic') c.chips=Object.keys(TOPICS).filter(k=>TEEN()||!TOPICS[k].teenOnly).map(k=>({l:L(TOPICS[k].chip),a:'t:'+k}));
  else if(kind==='yn') c.chips=[{l:t('yes'),a:'y'},{l:t('no'),a:'n'}];
  else if(kind==='person') c.chips=[{l:L(CH.yesPlease),a:'y',cls:'strong'},{l:L(CH.notNow),a:'n'}];
  else if(kind==='open') c.chips=[{l:t('talkPerson'),a:'person',cls:'strong'},{l:t('seePhones'),a:'phones'}];
  else c.chips=[];
}
const chatRender = () => { if(route()==='chat') render(); };
/* Bubo escribe sus mensajes uno a uno, con una pausa como si estuviera tecleando. */
async function say(list, chips){
  const c=S.chat; c.busy=true; c.chips=[]; chatRender();
  for(const [text,o] of list){
    await sleep(Math.min(1800, 500+text.length*12));
    if(S.chat!==c) return;
    addBot(text,o||{}); chatRender();
  }
  c.busy=false; setChips(chips); chatRender();
}
function onChip(a){
  const c=S.chat; if(c.busy) return;
  if(a==='person'){ c.view='callask'; render(); return window.scrollTo(0,0); }
  const ch=c.chips.find(x=>x.a===a); addMe(ch?ch.l:'');
  if(a==='y'||a==='n'||a==='d') return answerAsk({y:'yes',n:'no',d:'dunno'}[a]);
  if(a.startsWith('t:')) return topicReply(a.slice(2));
  if(a==='phones') return say([[L(CH.phonesIntro),{phones:'all'}]],'open');
}
/* Respuesta a un sí / no / no sé, según lo último que preguntó Bubo. */
function answerAsk(kind){
  const c=S.chat, ask=c.ask; c.ask=null;
  if(ask==='danger'){
    if(kind==='yes') return say([[L(CH.dangerYes),{kind:'crisis',phones:['112','900202010']}],[P('qTopic')]],'topic');
    return say([[P(kind==='no'?'dangerNo':'dangerDunno')],[P('qTopic'),{expr:'listen'}]],'topic');
  }
  if(ask==='told'){
    if(kind==='yes'){ c.ask='helped'; return say([[P('toldYes')]],'yn'); }
    c.ask='person'; return say([[P('toldNo'),{expr:'listen'}]],'person');
  }
  if(ask==='adult'){ c.ask='person'; return say([[P(kind==='yes'?'adultYes':'adultNo'),{expr:'listen'}]],'person'); }
  if(ask==='helped'){
    if(kind==='yes') return say([[P('helpedYes')]],'open');
    c.ask='person'; return say([[P('helpedNo'),{expr:'listen'}]],'person');
  }
  if(ask==='person'){
    if(kind==='yes'){ c.view='callask'; render(); return window.scrollTo(0,0); }
    return say([[P('personNo')]],'open');
  }
  if(ask==='howru' && (kind==='no'||kind==='dunno')){ c.ask='what'; return say([[L(FEEL.find(f=>f[0]==='bad')[2]),{expr:'listen'}]]); }
  if(kind==='good'||(ask==='howru'&&kind==='yes')) return say([[P('glad')]]);
  if(kind==='yes'){ c.ask='what'; return say([[P('goOn')]]); }
  if(kind==='no') return say([[P('okNo')]],'open');
  return say([[P('dunno'),{expr:'listen'}]]);
}
function topicReply(k){
  const c=S.chat, tp=TOPICS[k]||TOPICS.other, tk=TOPIC_TALK[k]||TOPIC_TALK.other; c.topic=k; c.miss=0;
  const list=[[L(pick(tk.open)),{expr:'listen'}]];
  tp.docs.forEach(id=>{ const d=CORPUS.find(x=>x.id===id); c.shown.add(id); list.push([DT(d),{src:d.src,kind:'info',expr:'talk'}]); });
  list.push([L(tk.q),{expr:'listen'}]); c.ask=tk.ask;
  return say(list, YN_ASKS.has(tk.ask)?'yn':'open');
}
function docReply(d){
  const c=S.chat; c.shown.add(d.id); c.miss=0; if(!c.topic) c.topic=d.topic; c.ask='what';
  return say([[P('answerLead')],[DT(d),{src:d.src,kind:'info',expr:'talk'}],[P('doubt'),{expr:'listen'}]],'open');
}
/* Bubo sin LLM: entiende saludos, emociones, sí/no y temas, y siempre contesta algo con sentido. */
function localReply(text){
  const c=S.chat, n=plain(text), f=FEEL.find(x=>x[1].test(n)), pre=[], keep=c.ask==='danger'?'danger':null;
  /* si alguien cuenta cómo se siente, solo se cambia a un tema si el texto encaja claramente */
  const hits=search(text).filter(r=>r.s>(f?3:1.2));
  /* si se menciona una red social o el móvil, el tema es ciberacoso aunque las palabras se parezcan a las del acoso escolar */
  if(ONLINE.test(n)) hits.sort((a,b)=>(b.doc.topic==='cyber')-(a.doc.topic==='cyber'));
  /* respuesta a una pregunta de sí/no pendiente, salvo que claramente cambie de tema */
  if(YN_ASKS.has(c.ask)){
    const yn=YN_LEAD.find(x=>x[1].test(n));
    const words=n.split(' ').length, jump=hits.find(r=>r.s>(c.ask==='danger'?3:4.5) && !c.shown.has(r.doc.id) && r.doc.topic!==c.topic);
    if(yn && !(jump && (c.ask==='danger' || words>5))) return answerAsk(yn[0]);
  }
  let intent=intentOf(n); if(SHORT.has(intent) && intent!=='bye' && n.split(' ').length>(c.ask?4:2) && (hits.length||f)) intent=null;
  if(intent==='greet'){
    const rest=n.replace(INTENT.find(x=>x[0]==='greet')[1],'').replace(/^(bubo)\b/,'').trim();
    if(!rest || !hits.length && !f){
      if(c.ask==='danger') return say([[P('greetBack')],[P('reDanger'),{expr:'listen'}]],'danger');
      c.ask='howru'; return say([[P('greetBack')+' '+P('howAreYou')]]);
    }
    pre.push([L({es:'¡Hola!',gl:'Ola!',en:'Hi!'})]);
  }
  else if(intent==='howru'){ c.ask='howru'; return say([[P('imFine')]]); }
  else if(intent==='who'){ c.ask=null; return say([[P('who')]],'open'); }
  else if(intent==='bye'){ c.ask=null; return say([[P('bye')]],'open'); }
  else if(intent==='thanks' && !hits.length) return say([[P('thanks')+(c.topic?' '+P('anythingElse'):'')]]);
  else if(intent && SHORT.has(intent)) return answerAsk(intent);
  const fresh=hits.find(r=>!c.shown.has(r.doc.id));
  if(hits.length){
    const top=hits[0].doc;
    /* a una pregunta concreta se le contesta con el texto que mejor encaja, no con todo el tema */
    if(isQuestion(text,n) && !c.shown.has(top.id) && c.ask!=='danger') return pre.length ? say(pre).then(()=>docReply(top)) : docReply(top);
    if(c.ask==='danger' || !c.topic || (top.topic!==c.topic && !c.shown.has(top.id))){ c.ask=null; return pre.length ? say(pre).then(()=>topicReply(top.topic)) : topicReply(top.topic); }
    const q=isQuestion(text,n);
    /* un texto nuevo solo si encaja con el tema actual o es una pregunta que lo pide claramente */
    if(fresh && (fresh.doc.topic===c.topic || (q && fresh.s>3))) return docReply(fresh.doc);
    if(q){ c.ask='person'; return say([...pre,[P('already')]],'person'); }
    if(top.topic===c.topic){ c.ask='person'; return say([...pre,[P('ongoing'),{expr:'listen'}]],'person'); }
  }
  if(f){ c.ask='what'; return say([...pre,[L(f[2]),{expr:'listen'}]]); }
  if((c.ask==='what'||c.ask==='howru'||hits.length) && n.split(' ').length>3 && c.miss===0){ c.miss++; return say([...pre,[P('tellMore'),{expr:'listen'}]]); }
  c.miss++;
  if(c.miss>=2){ c.ask='person'; return say([...pre,[P('notFound2')]],'person'); }
  return say([...pre,[P('notFound')]],keep);
}
/* Con LLM: se le pasan los últimos mensajes (ya sin datos personales) y los textos oficiales relevantes. */
async function llmChat(docs){
  if(!CONFIG.WORKER_URL) return null;
  try{ const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), CONFIG.WORKER_TIMEOUT_MS);
    const history=S.chat.msgs.filter(m=>m.text).slice(-8).map(m=>({role:m.who==='me'?'user':'assistant',content:m.text}));
    const r=await fetch(CONFIG.WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctrl.signal,
      body:JSON.stringify({lang:LANG, age:S.age, history, context:docs.map(d=>`[${d.src}] ${DT(d)}`).join('\n\n')})});
    clearTimeout(to); if(!r.ok) return null; const j=await r.json();
    return (j&&typeof j.answer==='string'&&j.answer.trim())?j.answer.trim():null;
  }catch(e){ return null; }
}
async function sendText(){
  const inp=document.getElementById('chatInput'); if(!inp) return;
  const raw=inp.value.trim(); if(!raw||S.chat.busy) return; inp.value='';
  const c=S.chat, {text,hit}=redact(raw);
  addMe(text);
  if(hit) addBot(t('redacted'),{kind:'crisis'});
  if(isRisk(text)){ c.ask=null; addBot(L(CH.crisis),{kind:'crisis',phones:['024','112']}); setChips('open'); return render(); }
  if(CONFIG.WORKER_URL){
    const docs=search(text).filter(r=>r.s>1.2).slice(0,2).map(r=>r.doc);
    c.busy=true; c.chips=[]; render();
    const ans=await llmChat(docs); if(S.chat!==c) return; c.busy=false;
    if(ans){ if(docs[0]&&!c.topic) c.topic=docs[0].topic; c.ask=null; addBot(ans,docs[0]?{src:docs.map(d=>d.src).join(' · '),kind:'info',expr:'talk'}:{expr:'talk'}); setChips(docs.length?'open':null); return chatRender(); }
  }
  render(); localReply(text);
}
function msgHTML(m){
  if(m.who==='me') return `<div class="msg me">${esc(m.text)}</div>`;
  let ph=''; if(m.phones) ph = m.phones==='all' ? phonesHTML() : phonesHTML(m.phones);
  return `<div class="mrow">${bubo(m.expr||'happy',40)}<div class="msg bot ${m.kind||''}">${esc(m.text)}${m.src?`<span class="src">${t('source')}: ${esc(m.src)}</span>`:''}${ph}<br>${spk(m.text)}</div></div>`;
}

function shuffleOrder(){ const idx=ORDER.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} orderState={next:0,shuffled:idx}; }
function orderBlock(){
  return `<h2 style="margin-top:0">${t('orderTitle')}</h2><p class="note">${t('orderDesc')}</p>

   ${orderState.next>=ORDER.length?`<div class="mrow">${bubo('party',46)}<div class="msg bot info">${t('orderDone')}</div></div>`:''}`;
}
function tapStep(i,el){ if(i<orderState.next) return; if(i===orderState.next){ orderState.next++; document.getElementById('orderBox').innerHTML=orderBlock(); } else { el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); } }

function aulaSlides(){
  const sl=[], cards=arr=>`<div class="grid3">${arr.map(r=>`<div class="card" style="margin:0"><span class="aic">${pic(r.e)}</span><br><b style="color:var(--pri)">${esc(L(r.t||r.l))}</b><p class="note">${esc(L(r.d||r.p))}</p></div>`).join('')}</div>`;
  sl.push(`<div class="slide" style="text-align:center">${bubo('happy',170)}<h1 style="font-size:1.9em">${t('appName')}</h1><p>${TEEN()?t('helloTeenSub'):t('helloKidSub')}</p></div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 1</span><h1>${L(LEVELS[0].t)}</h1>${cards(RIGHTS)}</div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 2</span><h1>${L(LEVELS[1].t)}</h1>${cards(PROS)}</div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 3</span><h1>${t('roomGesell')}</h1>${photoBlock('gesell','ag')}</div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 3</span><h1>${t('roomCourt')}</h1>${photoBlock('court','ac')}</div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 4</span><h1>${L(LEVELS[3].t)}</h1>${cards(EMOS)}</div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 5</span><h1>${L(LEVELS[4].t)}</h1>${cards(KEYS)}</div>`);
  sl.push(`<div class="slide"><span class="pill">${t('lvl')} 6</span><h1>${L(LEVELS[5].t)}</h1>${phonesHTML()}</div>`);
  const demo={es:[['me','Hola, en el grupo de clase se ríen de mí todos los días.'],['bot','Gracias por contármelo. Eso es acoso y no es culpa tuya. En tu colegio hay una persona coordinadora de bienestar que puede ayudarte.'],['bot','Si quieres, puedo ponerte en contacto con una persona especialista. Tú decides.']],
   gl:[['me','Ola, no grupo da clase rinse de min todos os días.'],['bot','Grazas por contarmo. Iso é acoso e non é culpa túa. No teu colexio hai unha persoa coordinadora de benestar que pode axudarte.'],['bot','Se queres, podo poñerte en contacto cunha persoa especialista. Ti decides.']],
   en:[['me','Hi, in the class group chat they laugh at me every day.'],['bot','Thank you for telling me. That is bullying and it is not your fault. Your school has a wellbeing coordinator who can help you.'],['bot','If you want, I can put you in touch with a specialist. It\'s up to you.']]}[LANG];
  sl.push(`<div class="slide"><h1>${t('tChat')}</h1><p class="note">${LANG==='en'?'Example with a made-up case':LANG==='gl'?'Exemplo cun caso inventado':'Ejemplo con un caso inventado'}</p><div class="msgs">${demo.map(([w,x])=>msgHTML({who:w,text:x,expr:'talk'})).join('')}</div></div>`);
  AULA_QUIZ.forEach((q,i)=>sl.push(`<div class="slide" id="aq${i}"><span class="pill">Quiz ${i+1}/${AULA_QUIZ.length}</span><h1>${esc(L(q.q))}</h1>${q.o.map((o,j)=>`<button class="opt" onclick="aulaAns(${i},${j})">${String.fromCharCode(65+j)}. ${esc(L(o))}</button>`).join('')}</div>`));
  sl.push(`<div class="slide" style="text-align:center"><h1>${t('aulaQR')}</h1><div id="qr" style="display:inline-block;background:#fff;padding:16px;border:1px solid var(--line);border-radius:var(--r)"></div><p class="note">${esc(location.href.split('#')[0])}</p></div>`);
  return sl;
}
function aulaAns(i,j){ const q=AULA_QUIZ[i], b=document.querySelectorAll('#aq'+i+' .opt'); b.forEach(x=>x.classList.remove('right','wrong')); b[j].classList.add(j===q.a?'right':'wrong'); if(j!==q.a) b[q.a].classList.add('right'); }
function viewAula(){
  const sl=aulaSlides(); S.aulaIdx=Math.max(0,Math.min(S.aulaIdx,sl.length-1));
  setTimeout(()=>{ const q=document.getElementById('qr'); if(q){ if(window.QRCode) new QRCode(q,{text:location.href.split('#')[0],width:220,height:220}); else q.textContent=location.href.split('#')[0]; } },60);
  return `${sl[S.aulaIdx]}<div class="slidenav"><button class="btn sec" onclick="aulaGo(-1)" ${S.aulaIdx===0?'disabled':''}>${ic('arrowL')} ${t('aulaPrev')}</button><span class="note">${S.aulaIdx+1} / ${sl.length}</span><button class="btn" onclick="aulaGo(1)" ${S.aulaIdx===sl.length-1?'disabled':''}>${t('aulaNext')} ${ic('arrowR')}</button></div>`;
}
function aulaGo(d){ S.aulaIdx+=d; render(); window.scrollTo(0,0); }
document.addEventListener('keydown',e=>{ if(route()!=='aula') return; if(e.key==='ArrowRight') aulaGo(1); if(e.key==='ArrowLeft') aulaGo(-1); });

function toggleSet(k){ S[k]=!S[k]; store.set(k,S[k]); render(); }

function showCamo(){
  const c=document.getElementById('camo');
  const days=['L','M','X','J','V'].map((d,i)=>`<div>${d}<br>${['☁️','⛅','🌧️','☁️','⛅'][i]}<br>${[16,18,15,17,19][i]}°</div>`).join('');
  c.innerHTML=`<div id="camoCloud"><svg width="170" height="136" viewBox="0 0 100 80" aria-hidden="true"><g fill="#fff"><ellipse cx="50" cy="54" rx="44" ry="21"/><circle cx="25" cy="45" r="18"/><circle cx="52" cy="31" r="25"/><circle cx="77" cy="47" r="15"/></g></svg></div><div class="temp">17°</div><div class="city">Nube · Nublado</div><div class="days">${days}</div>`;
  c.hidden=false; document.title='Nube'; document.getElementById('app').innerHTML=''; closeNav(); closeSos();
  let timer=null; const cl=document.getElementById('camoCloud');
  cl.addEventListener('pointerdown',e=>{e.preventDefault();timer=setTimeout(hideCamo,3000);}); ['pointerup','pointerleave'].forEach(ev=>cl.addEventListener(ev,()=>clearTimeout(timer))); cl.addEventListener('contextmenu',e=>e.preventDefault());
}
function hideCamo(){ document.getElementById('camo').hidden=true; document.title=t('appName'); render(); }

/* ======================= RENDER ======================= */
function render(){
  document.body.classList.toggle('kid',S.age==='kid'); document.body.classList.toggle('big',S.big); document.body.classList.toggle('contrast',S.contrast); document.body.classList.toggle('aula',route()==='aula');
  renderChrome();
  const app=document.getElementById('app'), r=route();
  let html;
  if(!S.age) html=viewAge();
  else if(r==='inicio') html=viewHome();
  else if(r==='chat') html=viewChat();
  else if(r==='juego') html=viewGame();
  else if(r.startsWith('nivel/')){ const n=+r.split('/')[1]; html=(LEVEL_VIEWS[n-1]||viewGame)(); }
  else if(r==='diccionario') html=viewDict();
  else if(r==='consejos') html=viewTips();
  else if(r.startsWith('consejos/')) html=viewTips(+r.split('/')[1]);
  else if(r==='ayuda') html=viewHelp();
  else if(r==='aula') html=viewAula();
  else if(r==='ajustes') html=viewSettings();
  else html=viewHome();
  const prev=document.getElementById('chatInput'), draft=prev?prev.value:'', typing=prev&&document.activeElement===prev;
  app.innerHTML=html;
  const inp=document.getElementById('chatInput'); if(inp&&draft) inp.value=draft; if(inp&&typing) inp.focus();
  if(r.startsWith('consejos/')){ const d=document.getElementById('tip'+r.split('/')[1]); if(d) d.scrollIntoView({block:'start'}); }
  if(r==='chat'&&S.age){ const m=document.getElementById('msgs'); if(m&&m.lastElementChild) m.lastElementChild.scrollIntoView({block:'end'}); }
}
let lastRoute=null;
window.addEventListener('hashchange',()=>{ const r=route(); if(r!==lastRoute){ window.scrollTo(0,0); lastRoute=r; } render(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.camo){ S.chat=null; showCamo(); } });
if(location.hash) history.replaceState(null,'',location.pathname);
if(S.camo) showCamo(); else render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>

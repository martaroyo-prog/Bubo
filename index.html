<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Justicia</title>
<meta name="theme-color" content="#23395B">
<meta name="description" content="Mi Justicia: información y ayuda para niños, niñas y adolescentes. Prototipo DATAthon Justicia 2026.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#23395B; --pri-d:#162741; --pri-l:#E9EEF5; --acc:#8C1C2E; --acc-l:#F7ECEE;
  --bg:#F4F5F7; --card:#FFFFFF; --text:#1F2933; --muted:#566271; --line:#D8DCE2;
  --ok:#2E7D5B; --ok-l:#E8F3EE; --sos:#B42318; --sos-l:#FDEDEB; --warn-l:#FFF6E6; --warn:#7A4A00;
  --r:8px; --fs:17px; --side:264px;
}
body.contrast{--pri:#00213F;--pri-d:#000;--pri-l:#FFF;--bg:#FFF;--text:#000;--muted:#000;--line:#000;--acc:#5A0012}
body.big{--fs:20px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.55;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* cabecera institucional */
.proto{background:var(--pri-d);color:#C9D3E0;font-size:.78em;padding:4px 16px;text-align:center}
.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:3px solid var(--acc);display:flex;align-items:center;gap:10px;padding:8px 14px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .t1{font-weight:700;font-size:1.15em;color:var(--pri);line-height:1.1}
.brand .t2{font-size:.78em;color:var(--muted);line-height:1.1}
.top .sp{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:var(--r);height:42px;padding:0 12px;font-weight:600;color:var(--pri)}
.hbtn:hover{background:var(--pri-l)}
.hbtn.sos{background:var(--sos);border-color:var(--sos);color:#fff}
.hbtn.sos:hover{background:#8F1C13}
.hbtn.exit{border-color:var(--sos);color:var(--sos)}
.menubtn{display:none}
/* layout */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 90px)}
.side{position:sticky;top:67px;width:var(--side);flex:0 0 var(--side);height:calc(100vh - 67px);overflow-y:auto;background:var(--card);border-right:1px solid var(--line);padding:14px 10px 30px}
.side h4{margin:14px 10px 6px;font-size:.75em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;border-radius:0 var(--r) var(--r) 0;padding:9px 10px;font-weight:600;color:var(--text)}
.nav:hover{background:var(--pri-l)}
.nav.on{background:var(--pri-l);border-left-color:var(--acc);color:var(--pri)}
.sub{margin:0 0 4px 22px;border-left:1px solid var(--line)}
.sub .nav{font-weight:400;font-size:.92em;padding:6px 10px}
.sub .nav .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:.7em;flex:0 0 auto}
.sub .nav .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
main{flex:1;min-width:0;max-width:880px;margin:0 auto;padding:22px 22px 80px}
.edge{display:none}
.scrim{display:none}
@media(max-width:900px){
  .menubtn{display:inline-flex}
  .side{position:fixed;top:0;left:0;height:100vh;z-index:60;transform:translateX(-102%);transition:transform .25s;box-shadow:4px 0 20px rgba(0,0,0,.15);padding-top:20px}
  body.navopen .side{transform:none}
  body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:55}
  .edge{display:flex;position:fixed;left:0;top:45%;z-index:35;writing-mode:vertical-rl;transform:rotate(180deg);background:var(--pri);color:#fff;border:0;border-radius:var(--r) 0 0 var(--r);padding:10px 3px;font-weight:700;font-size:.68em;letter-spacing:.08em;gap:4px;align-items:center;opacity:.92}
  .edge .ico{width:14px;height:14px}
  main{padding:16px 14px 80px 30px}
  .brand .t1{font-size:1em;white-space:nowrap}
  .hs{width:30px;height:30px;border-width:2px;font-size:.85em}
  .brand .t2{display:none}
  .hbtn .lbl{display:none}
}
footer{font-size:.8em;color:var(--muted);text-align:center;padding:18px 16px 30px;border-top:1px solid var(--line);background:var(--card)}
/* componentes */
h1{font-size:1.65em;line-height:1.2;margin:.1em 0 .4em;color:var(--pri)}
h2{font-size:1.25em;margin:1em 0 .4em;color:var(--pri)}
h3{font-size:1.05em;margin:.3em 0}
p{margin:.4em 0 .8em}
.muted{color:var(--muted)} .note{font-size:.86em;color:var(--muted)}
.crumb{font-size:.85em;color:var(--muted);margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.grid,.grid3{grid-template-columns:1fr}}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pri);border-radius:var(--r);padding:16px;transition:transform .15s, box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(35,57,91,.12)}
.tile .ic{width:44px;height:44px;border-radius:var(--r);background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile .ic .ico{width:24px;height:24px}
.tile b{display:block;color:var(--pri);font-size:1.05em}
.tile span.d{color:var(--muted);font-size:.9em}
.hero{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--acc);border-radius:var(--r);padding:18px}
.sosbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sos-l);border:1px solid #F1B8B2;border-radius:var(--r);padding:12px 16px;margin:14px 0;color:#7A1A12}
.sosbar .btn{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--pri);border-radius:var(--r);padding:10px 18px;font-weight:700;background:var(--pri);color:#fff;min-height:46px;text-decoration:none}
.btn:hover{background:var(--pri-d)}
.btn.sec{background:var(--card);color:var(--pri)}
.btn.sec:hover{background:var(--pri-l)}
.btn.sos{background:var(--sos);border-color:var(--sos)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;background:var(--pri-l);color:var(--pri);border-radius:999px;padding:2px 10px;font-size:.78em;font-weight:700}
.progress{height:8px;background:var(--pri-l);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.progress i{display:block;height:100%;background:var(--ok);transition:width .4s}
/* edad */
.age{max-width:620px;margin:6vh auto 0;text-align:center}
.age .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0}
@media(max-width:520px){.age .opts{grid-template-columns:1fr}}
.age .opt14{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:22px 14px;font-weight:700;font-size:1.15em;color:var(--pri);transition:border-color .15s, transform .15s}
.age .opt14:hover{border-color:var(--pri);transform:translateY(-2px)}
.age .opt14 small{display:block;font-weight:400;color:var(--muted);font-size:.75em;margin-top:6px}
/* chat */
.privacy{display:flex;gap:10px;background:var(--warn-l);color:var(--warn);border:1px solid #F0D9A8;border-radius:var(--r);padding:10px 12px;font-size:.92em}
.msgs{display:flex;flex-direction:column;gap:12px;padding:16px 0}
.mrow{display:flex;gap:10px;align-items:flex-end}
.msg{max-width:84%;padding:11px 14px;border-radius:12px;white-space:pre-wrap;word-wrap:break-word}
.msg.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:3px}
.msg.info{border-left:4px solid var(--ok)}
.msg.crisis{background:var(--sos-l);border-color:#F1B8B2}
.msg .src{display:block;margin-top:8px;font-size:.8em;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.speak{background:none;border:0;padding:4px 0 0;font-size:.82em;font-weight:700;color:var(--pri);display:inline-flex;gap:4px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px}
.chip{border:1px solid var(--pri);background:var(--card);color:var(--pri);border-radius:999px;padding:8px 14px;font-weight:600;min-height:42px}
.chip:hover{background:var(--pri-l)}
.chip.strong{background:var(--pri);color:#fff}
.chip.red{border-color:var(--sos);color:var(--sos)}
.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 12px;display:flex;gap:8px}
.composer input{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--card);min-height:48px}
.composer input:focus{outline:2px solid var(--pri);outline-offset:0}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.phone{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0}
.phone .num{font-weight:700;font-size:1.15em;color:var(--pri);min-width:90px}
.phone .btn{margin-left:auto;min-height:40px;padding:8px 14px}
.call{text-align:center;padding:28px 12px}
.call .timer{font-size:2em;font-weight:700;color:var(--pri)}
.pulse{animation:pu 1.6s infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* juego */
.lvl{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;transition:box-shadow .15s}
.lvl:hover{box-shadow:0 4px 14px rgba(35,57,91,.12)}
.lvl .n{flex:0 0 44px;height:44px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-weight:700;font-size:1.15em;display:flex;align-items:center;justify-content:center}
.lvl.done .n{background:var(--ok);color:#fff}
.flip{perspective:900px;height:160px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line)}
.flip .f{background:var(--pri-l);color:var(--pri)} .flip .f .e{font-size:36px}
.flip .b{background:var(--card);transform:rotateY(180deg);font-size:.95em}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 14px;margin:8px 0;min-height:46px}
.opt:hover{border-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--ok-l)} .opt.wrong{border-color:var(--sos);background:var(--sos-l)}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:10px 0 14px;gap:4px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--pri);border-bottom-color:var(--acc)}
.photo{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#000}
.photo img{display:block;width:100%;height:auto}
.hs{position:absolute;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:var(--acc);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:0}
.hs::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,255,255,.8);animation:ring 2s infinite}
.hs.on{background:var(--pri);transform:translate(-50%,-50%) scale(1.15)}
@keyframes ring{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.5)}}
.credit{font-size:.75em;color:var(--muted);margin:6px 0 0}
.hlist{counter-reset:h;list-style:none;padding:0;margin:10px 0}
.hlist li button{display:flex;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin:6px 0}
.hlist li button.on{border-color:var(--pri);background:var(--pri-l)}
.hlist .k{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.85em}
.step{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:11px 14px;margin:8px 0}
.step.placed{background:var(--ok-l);border-color:var(--ok)}
.step.no{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.emo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.emo button{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 4px;font-weight:600}
.emo button .e{font-size:34px;display:block}
.emo button.sel{border-color:var(--pri);background:var(--pri-l)}
.breath{display:flex;flex-direction:column;align-items:center;gap:10px}
.ball{width:110px;height:110px;border-radius:50%;background:var(--pri-l);border:3px solid var(--pri);transition:transform 4s ease-in-out}
.ball.grow{transform:scale(1.4)}
.lvnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
/* diccionario */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.word{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.word .e{font-size:30px}
.word b{display:block;color:var(--pri);margin:4px 0}
.word p{font-size:.9em;margin:0}
.search{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;background:var(--card);min-height:48px;margin-bottom:14px}
details{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:var(--r);padding:12px 16px;margin:12px 0}
details summary{font-weight:700;color:var(--pri);cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";float:right;font-size:1.2em}
details[open] summary::after{content:"−"}
/* aula */
body.aula{--fs:22px}
.slide{min-height:58vh}
.slidenav{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);padding:12px 0;border-top:1px solid var(--line)}
/* ajustes */
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.sw{width:52px;height:30px;border-radius:999px;border:0;background:#C3CAD3;position:relative;flex:0 0 auto}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ok)}.sw.on::after{left:25px}
select{padding:8px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
/* modal 112 */
.modal{position:fixed;inset:0;z-index:90;background:rgba(15,25,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.modal .box{background:var(--card);border-radius:var(--r);max-width:440px;width:100%;padding:22px;border-top:6px solid var(--sos);max-height:92vh;overflow:auto}
.big112{font-size:3.4em;font-weight:700;color:var(--sos);line-height:1;text-align:center;margin:8px 0}
/* camuflaje */
#camo{position:fixed;inset:0;z-index:100;background:linear-gradient(#7EC3F0,#D6EEFB);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#123;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}
#camo[hidden]{display:none}
#camo .temp{font-size:72px;font-weight:300}
#camo .city{font-size:22px}
#camo .days{display:flex;gap:18px;margin-top:30px;font-size:15px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #4C8BD6;outline-offset:2px}
</style>
</head>
<body>
<div class="proto" id="proto"></div>
<header class="top" id="top"></header>
<div class="layout">
  <nav class="side" id="side" aria-label="Menú"></nav>
  <div class="scrim" onclick="closeNav()"></div>
  <main id="app" tabindex="-1"></main>
</div>
<button class="edge" id="edge" onclick="openNav()" aria-label="Menú"></button>
<footer id="foot"></footer>
<div class="modal" id="sosModal" hidden role="dialog" aria-modal="true"></div>
<div id="camo" hidden></div>

<script>
/* ======================= CONFIGURACIÓN ======================= */
const CONFIG = {
  WORKER_URL: '',          // URL del Cloudflare Worker (worker.js). Vacío = respuestas oficiales preparadas, sin conexión.
  WORKER_TIMEOUT_MS: 9000
};

/* ======================= ESTADO =======================
   La conversación, la edad y el progreso viven SOLO en memoria.
   Solo se guardan preferencias que no identifican a nadie (idioma, letra, contraste, camuflaje). */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('mj_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('mj_'+k, JSON.stringify(v)); }catch(e){} }
};
let LANG = store.get('lang','es');
const S = { age:null, chat:null, done:new Set(), big:store.get('big',false), contrast:store.get('contrast',false), camo:store.get('camo',false), autoSpeak:false, aulaIdx:0 };
const TEEN = () => S.age === 'teen';

/* ======================= TEXTOS DE INTERFAZ ======================= */
const T = {
es:{appName:'Mi Justicia', appSub:'Infancia y adolescencia', proto:'Prototipo · DATAthon Justicia 2026 · No es una aplicación oficial',
 exit:'Salir', sos:'112', sosLbl:'Emergencia', menu:'Menú', home:'Inicio', settings:'Ajustes', changeAge:'Cambiar edad',
 secMain:'Secciones', secGame:'Mi camino por la justicia', secTips:'Consejos importantes',
 ageTitle:'Bienvenida a Mi Justicia', ageSub:'Para adaptar las explicaciones, dinos tu edad. No la guardamos en ningún sitio.',

 helloKid:'¡Hola! Soy Bubo', helloKidSub:'Te acompaño para que entiendas cómo funciona la justicia y sepas dónde pedir ayuda.',
 helloTeen:'Información y ayuda para adolescentes', helloTeenSub:'Conoce tus derechos, cómo funcionan los procedimientos judiciales y a quién acudir. Soy Bubo y te acompaño.',
 dangerNow:'¿Estás en peligro ahora mismo?', callSos:'Llamar al 112',
 tChat:'Habla con Bubo', dChat:'Pregunta lo que te preocupa', tGame:'Mi camino por la justicia', dGame:'Conoce el juzgado paso a paso',
 tDict:'Diccionario', dDict:'Palabras jurídicas explicadas', tTips:'Consejos importantes', dTips:'Ciberacoso, imágenes y juicios',
 tHelp:'Teléfonos de ayuda', dHelp:'Personas que pueden ayudarte', tAula:'Modo aula', dAula:'Para proyectar en clase',
 noSave:'Esta aplicación no guarda nada de lo que haces ni de lo que escribes. Si alguien se acerca, pulsa «Salir».',
 privacy:'Este chat no guarda ni envía nada de lo que escribes. No pongas tu nombre, dirección, colegio ni teléfono.',
 placeholder:'Escribe aquí…', send:'Enviar', listen:'Escuchar', thinking:'Bubo está escribiendo',
 redacted:'He ocultado un dato personal para protegerte. No hace falta que digas quién eres.',
 source:'Fuente oficial', talkPerson:'Hablar con una persona', seePhones:'Ver teléfonos de ayuda', keepTalking:'Seguir hablando',

/* ======================= BUBO (búho guía) ======================= */
function bubo(expr='happy', w=64){
  const eyesOpen = `<circle cx="37" cy="42" r="7" fill="#1E2A3A"/><circle cx="63" cy="42" r="7" fill="#1E2A3A"/><circle cx="39.5" cy="39.5" r="2.4" fill="#fff"/><circle cx="65.5" cy="39.5" r="2.4" fill="#fff"/>`;
  const eyesClosed = `<path d="M30 43q7-7 14 0M56 43q7-7 14 0" fill="none" stroke="#1E2A3A" stroke-width="3.2" stroke-linecap="round"/>`;
  let eyes = expr==='happy'||expr==='party' ? eyesClosed : eyesOpen;
  let beak = expr==='talk' ? `<path d="M45 51h10l-5 9z" fill="#E08A2E"/><path d="M47 55h6" stroke="#9A5512" stroke-width="1.5"/>` : `<path d="M45 51h10l-5 8z" fill="#E08A2E"/>`;
  let extra = (expr==='listen'||expr==='party') ? `<ellipse cx="26" cy="54" rx="5" ry="3" fill="#F2B8B0"/><ellipse cx="74" cy="54" rx="5" ry="3" fill="#F2B8B0"/>` : '';
  if(expr==='party') extra += `<circle cx="10" cy="14" r="3" fill="#8C1C2E"/><circle cx="90" cy="12" r="3" fill="#E08A2E"/><circle cx="86" cy="28" r="2.5" fill="#2E7D5B"/>`;
  return `<svg width="${w}" height="${w}" viewBox="0 0 100 100" aria-hidden="true">
   <path d="M22 26L28 8l12 14M78 26L72 8 60 22" fill="#8A6A4F"/>
   <ellipse cx="50" cy="57" rx="35" ry="38" fill="#A9825F"/>
   <ellipse cx="18" cy="64" rx="8" ry="20" fill="#8A6A4F" transform="rotate(12 18 64)"/><ellipse cx="82" cy="64" rx="8" ry="20" fill="#8A6A4F" transform="rotate(-12 82 64)"/>
   <ellipse cx="50" cy="74" rx="22" ry="19" fill="#F3E6D3"/>
   <path d="M42 70q3 3 6 0M52 70q3 3 6 0M47 78q3 3 6 0" fill="none" stroke="#D8C2A4" stroke-width="1.6" stroke-linecap="round"/>
   <circle cx="37" cy="42" r="14" fill="#F3E6D3"/><circle cx="63" cy="42" r="14" fill="#F3E6D3"/>
   ${extra}${eyes}${beak}
   <path d="M40 94l-3 4M44 95v4M56 95v4M60 94l3 4" stroke="#E08A2E" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}

{id:'acoso', topic:'bullying', src:'Ley Orgánica 8/2021, LOPIVI (arts. 34 y 35)',

function redact(s){
  let out=s, hit=false;
  const rules=[/\b[\w.+-]+@[\w-]+\.[\w.]+\b/g, /(\+?34[\s-]?)?\b[6789]\d{2}[\s-]?\d{2,3}[\s-]?\d{2,3}[\s-]?\d{0,2}\b/g, /\b\d{8}[A-Za-z]\b/g, /\b[XYZxyz]\d{7}[A-Za-z]\b/g,
   /\b(calle|c\/|avenida|avda\.?|plaza|paseo|r[uú]a|praza|street|road|avenue)\s+[^\s,.;]+(\s+[^\s,.;]+)?(\s*,?\s*(n[ºo°.]?\s*)?\d+)?/gi,
   /\b(colegio|cole|instituto|ies|ceip|colexio|school)\s+([A-ZÁÉÍÓÚÑ][\wáéíóúñ]+(\s+[A-ZÁÉÍÓÚÑ][\wáéíóúñ]+)*)/g];
  rules.forEach(r=>{ out=out.replace(r,()=>{hit=true;return '[···]';}); });
  out = out.replace(/\b(me llamo|mi nombre es|ch[aá]mome|o meu nome [eé]|my name is|i am called|i'm called)\s+([^\s,.!?]+)/gi,(m,a)=>{hit=true;return a+' [···]';});
  return {text:out, hit};
}

function buildIndex(){
  const docs = CORPUS.map(d=>tok(d.text[LANG]+' '+d.teen[LANG]+' '+d.kw+' '+d.kw));

function search(q){
  if(!INDEX||INDEX.lang!==LANG) buildIndex();
  const qs=tok(q), k1=1.4, b=.75, {docs,df,avg,N}=INDEX;
  return docs.map((d,i)=>{ let s=0; const tf={}; d.forEach(w=>tf[w]=(tf[w]||0)+1);
    qs.forEach(w=>{ if(!tf[w]) return; const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5)); s+=idf*(tf[w]*(k1+1))/(tf[w]+k1*(1-b+b*d.length/avg)); });
    return {doc:CORPUS[i], s}; }).sort((a,b)=>b.s-a.s);
}

      body:JSON.stringify({lang:LANG, age:S.age, question, context:L(doc), source:doc.src})});

/* El chat NO guarda lo que se escribe: solo los mensajes en pantalla mientras está abierto,
   y el tema elegido (para saber con qué especialista conectar). Nada se envía a ningún sitio. */
function newChat(){ S.chat={msgs:[],chips:[],step:'danger',topic:null,listenIdx:0,view:'chat',busy:false}; addBot(L(CH.greet)); addBot(L(CH.qDanger),{expr:'listen'}); setChips('danger'); }
function addBot(text,o={}){ S.chat.msgs.push({who:'bot',text,...o}); if(S.autoSpeak) speak(text); }
function addMe(text){ S.chat.msgs.push({who:'me',text}); }
function setChips(kind){
  const c=S.chat; c.step=kind;
  if(kind==='danger') c.chips=[{l:t('yes'),a:'dYes',cls:'red'},{l:t('no'),a:'dNo'},{l:L(CH.dunno),a:'dDunno'}];
  else if(kind==='topic') c.chips=Object.keys(TOPICS).filter(k=>TEEN()||!TOPICS[k].teenOnly).map(k=>({l:L(TOPICS[k].chip),a:'t:'+k}));
  else if(kind==='open') c.chips=[{l:t('talkPerson'),a:'person',cls:'strong'},{l:t('seePhones'),a:'phones'},{l:t('keepTalking'),a:'keep'}];
  else c.chips=[];
}
function onChip(a){
  const c=S.chat; if(c.busy) return;
  if(a==='person'){ c.view='callask'; render(); return window.scrollTo(0,0); }
  const ch=c.chips.find(x=>x.a===a); addMe(ch?ch.l:'');
  if(a==='dYes'){ addBot(L(CH.dangerYes),{kind:'crisis',phones:['112','900202010']}); addBot(L(CH.qTopic)); setChips('topic'); }
  else if(a==='dNo'||a==='dDunno'){ if(a==='dNo') addBot(L(CH.dangerNo)); addBot(L(CH.qTopic),{expr:'listen'}); setChips('topic'); }
  else if(a.startsWith('t:')){ c.topic=a.slice(2); giveTopicInfo(); }
  else if(a==='phones'){ addBot(L(CH.phonesIntro),{phones:'all'}); setChips('open'); }
  else if(a==='keep'){ addBot(L(CH.keep)); setChips('open'); }
  render();
}
function giveTopicInfo(){
  const c=S.chat, tp=TOPICS[c.topic||'other'];
  addBot(L(CH.thanks));
  tp.docs.forEach(id=>{ const d=CORPUS.find(x=>x.id===id); addBot(L(d),{src:d.src,kind:'info',expr:'talk'}); });
  addBot(L(CH.offer)); setChips('open');
}
async function sendText(){
  const inp=document.getElementById('chatInput'); if(!inp) return;
  const raw=inp.value.trim(); if(!raw||S.chat.busy) return; inp.value='';
  const c=S.chat, {text,hit}=redact(raw);
  addMe(text);
  if(hit) addBot(t('redacted'),{kind:'crisis'});
  if(isRisk(text)){ addBot(L(CH.crisis),{kind:'crisis',phones:['024','112']}); setChips('open'); return render(); }
  const res=search(text), top=res[0];
  if(top.s>1.2 && !c.topic) c.topic=top.doc.topic;
  if((c.step==='danger'||c.step==='topic') && top.s>1.2){ c.topic=top.doc.topic; giveTopicInfo(); return render(); }
  const isQ=/\?|¿|que es|qué es|como|cómo|puedo|podo|can i|what|how|derecho|dereito|right/i.test(text);
  if(VENT.test(norm(text)) && !isQ){ addBot(L(CH.listen[c.listenIdx++%CH.listen.length]),{expr:'listen'}); if(c.step!=='danger'&&c.step!=='topic') setChips('open'); return render(); }
  if(top.s<1.2){ addBot(L(CH.notFound)); setChips('open'); return render(); }
  c.busy=true; render();
  const ans=await llmRephrase(text, top.doc); c.busy=false;
  addBot(ans||L(top.doc),{src:top.doc.src,kind:'info',expr:'talk'}); setChips('open'); render();
}

  return `<div class="mrow">${bubo(m.expr||'happy',40)}<div class="msg bot ${m.kind||''}">${esc(m.text)}${m.src?`<span class="src">${t('source')}: ${esc(m.src)}</span>`:''}${ph}<br>${spk(m.text)}</div></div>`;
}

   <p class="note">${t('tapPoint')}</p>${photoBlock(roomMode)}${P.note?`<p class="note">${esc(L(P.note))}</p>`:''}`;
}
function shuffleOrder(){ const idx=ORDER.map((_,i)=>i); for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];} orderState={next:0,shuffled:idx}; }
function orderBlock(){
  return `<h2 style="margin-top:0">${t('orderTitle')}</h2><p class="note">${t('orderDesc')}</p>
   ${orderState.shuffled.map(i=>`<button class="step ${i<orderState.next?'placed':''}" onclick="tapStep(${i},this)">${i<orderState.next?`<b>${i+1}.</b> `:''}${esc(L(ORDER[i]))}</button>`).join('')}
   ${orderState.next>=ORDER.length?`<div class="mrow">${bubo('party',46)}<div class="msg bot info">${t('orderDone')}</div></div>`:''}`;
}
function tapStep(i,el){ if(i<orderState.next) return; if(i===orderState.next){ orderState.next++; document.getElementById('orderBox').innerHTML=orderBlock(); } else { el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); } }

  const sw=(on,fn)=>`<button class="sw ${on?'on':''}" role="switch" aria-checked="${on}" onclick="${fn}"></button>`;
  return `<div class="crumb">${t('home')} › ${t('settings')}</div><h1>${t('settings')}</h1><div class="card">
   <div class="set"><b>${t('setLang')}</b><select onchange="setLang(this.value)"><option value="es" ${LANG==='es'?'selected':''}>Español</option><option value="gl" ${LANG==='gl'?'selected':''}>Galego</option><option value="en" ${LANG==='en'?'selected':''}>English</option></select></div>
   <div class="set"><span>${t('setBig')}</span>${sw(S.big,"toggleSet('big')")}</div>
   <div class="set"><span>${t('setContrast')}</span>${sw(S.contrast,"toggleSet('contrast')")}</div>
   <div class="set"><span>${t('setSpeak')}</span>${sw(S.autoSpeak,"S.autoSpeak=!S.autoSpeak;render()")}</div>
   <div class="set"><b>${t('changeAge')}</b><button class="btn sec" onclick="changeAge()">${ic('user')} ${t('changeAge')}</button></div>
   <div class="set" style="border:0"><span><b>${t('setCamo')}</b><br><span class="note">${t('setCamoD')}</span></span>${sw(S.camo,"toggleSet('camo')")}</div>
   <button class="btn sec" onclick="showCamo()">${t('setCamoNow')}</button></div>
   <p class="note">${ic('lock')} ${t('noSave')}</p>`;
}
function setLang(l){ LANG=l; store.set('lang',l); INDEX=null; if(S.chat&&S.chat.msgs.length<=2) S.chat=null; render(); }
function toggleSet(k){ S[k]=!S[k]; store.set(k,S[k]); render(); }

/* ======================= CAMUFLAJE ======================= */
function showCamo(){
  const c=document.getElementById('camo');
  const days=['L','M','X','J','V'].map((d,i)=>`<div>${d}<br>${['☁️','⛅','🌧️','☁️','⛅'][i]}<br>${[16,18,15,17,19][i]}°</div>`).join('');
  c.innerHTML=`<div id="camoCloud"><svg width="170" height="136" viewBox="0 0 100 80" aria-hidden="true"><g fill="#fff"><ellipse cx="50" cy="54" rx="44" ry="21"/><circle cx="25" cy="45" r="18"/><circle cx="52" cy="31" r="25"/><circle cx="77" cy="47" r="15"/></g></svg></div><div class="temp">17°</div><div class="city">Nube · Nublado</div><div class="days">${days}</div>`;
  c.hidden=false; document.title='Nube'; document.getElementById('app').innerHTML=''; closeNav(); closeSos();
  let timer=null; const cl=document.getElementById('camoCloud');
  cl.addEventListener('pointerdown',e=>{e.preventDefault();timer=setTimeout(hideCamo,3000);}); ['pointerup','pointerleave'].forEach(ev=>cl.addEventListener(ev,()=>clearTimeout(timer))); cl.addEventListener('contextmenu',e=>e.preventDefault());
}
function hideCamo(){ document.getElementById('camo').hidden=true; document.title=t('appName'); render(); }

/* ======================= RENDER ======================= */
function render(){
  document.body.classList.toggle('big',S.big); document.body.classList.toggle('contrast',S.contrast); document.body.classList.toggle('aula',route()==='aula');
  renderChrome();
  const app=document.getElementById('app'), r=route();
  let html;
  if(!S.age) html=viewAge();
  else if(r==='inicio') html=viewHome();
  else if(r==='chat') html=viewChat();
  else if(r==='juego') html=viewGame();
  else if(r.startsWith('nivel/')){ const n=+r.split('/')[1]; html=(LEVEL_VIEWS[n-1]||viewGame)(); }
  else if(r==='diccionario') html=viewDict();
  else if(r==='consejos') html=viewTips();
  else if(r.startsWith('consejos/')) html=viewTips(+r.split('/')[1]);
  else if(r==='ayuda') html=viewHelp();
  else if(r==='aula') html=viewAula();
  else if(r==='ajustes') html=viewSettings();
  else html=viewHome();
  app.innerHTML=html;
  if(r.startsWith('consejos/')){ const d=document.getElementById('tip'+r.split('/')[1]); if(d) d.scrollIntoView({block:'start'}); }
  if(r==='chat'&&S.age){ const m=document.getElementById('msgs'); if(m&&m.lastElementChild) m.lastElementChild.scrollIntoView({block:'end'}); }
}
let lastRoute=null;
window.addEventListener('hashchange',()=>{ const r=route(); if(r!==lastRoute){ window.scrollTo(0,0); lastRoute=r; } render(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&S.camo){ S.chat=null; showCamo(); } });
if(location.hash) history.replaceState(null,'',location.pathname);
if(S.camo) showCamo(); else render();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
